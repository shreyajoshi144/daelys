[project]
name = "daelys"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.2",
    "sqlalchemy[asyncio]==2.1.8",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "arq==0.28.0",
    "redis==5.3.1",
    "pyjwt[crypto]==2.15.1",
    "bcrypt==5.0.0",
    "httpx==0.28.1",
    "anthropic==2.6.0",
    "pypdf==7.0.0",
    "langgraph==1.2.20",
]

[project.optional-dependencies]
# Audio meetings: Notiv's transcription (faster-whisper) and its import chain (OpenCV via notiv.align).
meetings = [
    "faster-whisper==1.2.1",
    "av==18.1.0",
    "opencv-python-headless==5.0.0.93",
]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "pip-audit",
    "httpx2==2.16.0",  # imported directly by tests (comes with the anthropic SDK)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "core*", "connectors*", "workers*", "rules*", "agents*", "evaluation*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["web", ".venv", "verification", "sprints"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S311"]
"migrations/versions/*" = ["UP031", "E501", "S608"]
# Rule SQL is formatted once at import from module constants only (see the comment above _FMT).
"rules/checks.py" = ["S608"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["arq.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["api", "core", "connectors", "workers", "rules", "agents", "evaluation"]
